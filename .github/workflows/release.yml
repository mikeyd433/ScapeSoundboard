name: Release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The installers are published under stable filenames so that
# dabingabongo.com/downloads can link to /releases/latest/download/<name>
# and never need updating when a new version ships.

on:
  push:
    tags:
      - 'v*'
    # Pushing `release/v0.2.0` cuts v0.2.0. This exists because some
    # environments can push branches but not tags.
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish, e.g. v0.2.0. Leave blank to build without releasing.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)          tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/*) tag="${GITHUB_REF_NAME#release/}" ;;
            *)                    tag="${{ github.event.inputs.version }}" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-<none, build only>}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Frontend tests and typecheck
        run: |
          npm test
          npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # NSIS only. An MSI would exist for Group Policy / Intune style deployment,
      # which is not what this app is for, and a second download on the page is
      # just a decision nobody wants to make.
      - name: Build installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect artifact under a stable name
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          New-Item -ItemType Directory -Force -Path dist-installers | Out-Null

          $nsis = Get-ChildItem "$bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found under $bundle/nsis" }

          Copy-Item $nsis "dist-installers/OSRS-Soundboard-Setup-x64.exe"
          Get-ChildItem dist-installers | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist-installers/*

      # Creates the tag at this commit when it does not already exist, which is
      # how releases get cut when tags cannot be pushed directly.
      - name: Publish release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: OSRS Soundboard ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist-installers/*
          generate_release_notes: true
          body: |
            Windows installer for the OSRS Soundboard.

            Run `OSRS-Soundboard-Setup-x64.exe`. It installs for the current user
            with no admin prompt, and adds a desktop shortcut and a Start menu entry.

            The app ships empty and downloads its own audio library from the
            OSRS Wiki on first run. Nothing is bundled with the installer.

            The installer is unsigned, so SmartScreen will warn on first launch —
            choose "More info" then "Run anyway".
